<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Podany - Private Podcast Player</title>
  <meta name="description"
    content="Personal private podcast RSS feed aggregator and continuous audio player, self-hosted.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <div id="app"><!-- von AppShell gerendert --></div>

  <!-- Nur noch Nicht-UI-Ressourcen -->
  <audio id="audio-engine" preload="auto"></audio>
  <div id="yt-player-container"
    style="position: fixed; width: 320px; height: 180px; left: -9999px; top: -9999px; pointer-events: none; overflow: hidden;">
    <div id="yt-player"></div>
  </div>

  <!-- YouTube Iframe API 
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="dist/bundle.js"></script>-->
  <script>
    navigator.serviceWorker.getRegistrations().then(registrations => {
      for (let registration of registrations) {
        registration.unregister();
      }
    });
  </script>
  <script type="module" src="/js/main.js"></script>
</body>

</html>
